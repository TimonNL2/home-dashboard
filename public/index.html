<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1220">
  <title>Home</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="/fonts/hanken.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="#/" id="brand">Home</a>
      <nav class="tabs" aria-label="Tabbladen">
        <a href="#/" data-view="dashboard" class="active">Dashboard</a>
        <a href="#/wereld" data-view="world">Wereld</a>
      </nav>
      <button class="icon-btn" id="theme-btn" title="Thema wisselen" aria-label="Thema wisselen"></button>
    </header>

    <div id="view-dashboard">
      <section class="hero" aria-label="Overzicht">
        <a class="hero-earth" id="hero-earth" href="#/wereld" aria-label="Open de wereldkaart"></a>
        <div class="hero-copy">
          <h1 class="greeting" id="greeting">Hallo</h1>
          <time class="clock" id="clock"><span id="clock-hm">--:--</span><span class="sec" id="clock-s"></span></time>
          <p class="date"><span id="date"></span><span id="hero-weather"></span></p>
          <dl class="hero-stats" id="hero-stats">
            <div><dt>Services online</dt><dd id="hs-services">–</dd></div>
            <div><dt>Processor</dt><dd id="hs-cpu">–</dd></div>
            <div><dt>Geheugen</dt><dd id="hs-mem">–</dd></div>
          </dl>
        </div>
      </section>

      <form class="search" id="search-form" autocomplete="off" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="search" type="text" placeholder="Zoek op het web of filter je services" aria-label="Zoeken">
        <kbd>/</kbd>
      </form>

      <main class="layout">
        <section class="main-col">
          <div id="services"></div>
          <div id="bookmarks-wrap" hidden>
            <h2 class="section-title">Bladwijzers</h2>
            <div id="bookmarks" class="bookmarks"></div>
          </div>
        </section>

        <aside class="instruments">
          <section class="inst" id="weather-card" hidden>
            <div class="inst-head"><h3>Weer</h3><span class="muted" id="weather-loc"></span></div>
            <div id="weather" class="weather"><div class="skeleton"></div></div>
          </section>

          <section class="inst" id="system-card" hidden>
            <div class="inst-head"><h3>Server</h3><span class="muted" id="sys-host"></span></div>
            <div id="system"><div class="skeleton"></div></div>
          </section>

          <section class="inst" id="todo-card" hidden>
            <div class="inst-head"><h3>Taken</h3><button class="link-btn" id="todo-clear">Afgeronde wissen</button></div>
            <form id="todo-form" class="todo-form">
              <input id="todo-input" type="text" placeholder="Taak toevoegen" maxlength="500" aria-label="Taak toevoegen">
            </form>
            <ul id="todos" class="todos"></ul>
          </section>

          <section class="inst" id="docker-card" hidden>
            <div class="inst-head"><h3>Containers</h3><span class="muted" id="docker-count"></span></div>
            <ul id="docker" class="docker"></ul>
          </section>
        </aside>
      </main>
    </div>

    <div id="view-world" hidden>
      <div class="world">
        <div class="globe-wrap">
          <div id="globe"></div>
          <div class="globe-tools">
            <form id="geo-form" class="geo-search" autocomplete="off" role="search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
              <input id="geo-input" type="text" placeholder="Zoek een stad of plek" aria-label="Plek zoeken">
            </form>
            <ul id="geo-results" class="geo-results" hidden></ul>
          </div>
          <div class="globe-btns">
            <button class="icon-btn" id="globe-rotate" title="Automatisch draaien" aria-label="Automatisch draaien"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
            <button class="icon-btn" id="globe-arcs" title="Reislijnen vanaf thuis" aria-label="Reislijnen"><svg viewBox="0 0 24 24"><path d="M4 18C8 7 16 7 20 18"/><circle cx="4" cy="18" r="1.4"/><circle cx="20" cy="18" r="1.4"/></svg></button>
            <button class="icon-btn" id="globe-home" title="Naar thuis" aria-label="Naar thuis"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg></button>
          </div>
          <div class="globe-hint" id="globe-hint">Klik op de aarde om een plek toe te voegen</div>
          <div class="globe-loading" id="globe-loading">Aarde laden</div>
        </div>

        <aside class="instruments world-side">
          <section class="inst">
            <div class="world-stats" id="world-stats"></div>
          </section>
          <section class="inst">
            <div class="inst-head"><h3>Mijn plekken</h3><span class="muted" id="places-count"></span></div>
            <div class="chips" id="place-filter">
              <button data-f="all" class="active">Alles</button>
              <button data-f="visited">Bezocht</button>
              <button data-f="wish">Wil heen</button>
            </div>
            <ul id="places" class="places"></ul>
          </section>
        </aside>
      </div>
    </div>
  </div>

  <dialog id="place-dialog" class="dialog">
    <form method="dialog" id="place-form">
      <h3 id="place-title">Plek toevoegen</h3>
      <div class="muted" id="place-coords"></div>
      <label>Naam<input name="name" required maxlength="120" placeholder="Barcelona"></label>
      <div class="seg" role="radiogroup" aria-label="Soort plek">
        <label><input type="radio" name="type" value="visited" checked><span><i class="sw visited"></i>Bezocht</span></label>
        <label><input type="radio" name="type" value="wish"><span><i class="sw wish"></i>Wil heen</span></label>
        <label><input type="radio" name="type" value="home"><span><i class="sw home"></i>Thuis</span></label>
      </div>
      <label><span>Wanneer <span class="muted">optioneel</span></span><input name="date" type="month"></label>
      <label><span>Notitie <span class="muted">optioneel</span></span><textarea name="note" rows="3" maxlength="1000" placeholder="Wat wil je onthouden?"></textarea></label>
      <div class="dialog-btns">
        <button type="button" class="btn danger" id="place-delete" hidden>Verwijderen</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="place-cancel">Annuleren</button>
        <button type="submit" class="btn primary">Opslaan</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="icons.js"></script>
  <script src="earth.js"></script>
  <script src="app.js"></script>
  <script src="world.js"></script>
</body>
</html>
