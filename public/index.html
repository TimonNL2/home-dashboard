<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1115">
  <title>Home</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="greeting" id="greeting">Hallo</div>
        <div class="date" id="date"></div>
      </div>
      <div class="top-right">
        <nav class="tabs" aria-label="Tabbladen">
          <a href="#/" data-view="dashboard" class="active">Dashboard</a>
          <a href="#/wereld" data-view="world">Wereld</a>
        </nav>
        <div class="clock" id="clock">--:--</div>
        <button class="icon-btn" id="theme-btn" title="Thema wisselen" aria-label="Thema wisselen"></button>
      </div>
    </header>

    <div id="view-dashboard">
    <form class="search" id="search-form" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Zoeken of services filteren…  ( / )" aria-label="Zoeken">
      <kbd>Enter</kbd>
    </form>

    <main class="layout">
      <section class="main-col">
        <div id="services"></div>
        <div id="bookmarks-wrap" hidden>
          <h2 class="section-title">Bladwijzers</h2>
          <div id="bookmarks" class="bookmarks"></div>
        </div>
      </section>

      <aside class="side-col">
        <div class="card" id="weather-card" hidden>
          <div class="card-head"><h3>Weer</h3><span class="muted" id="weather-loc"></span></div>
          <div id="weather" class="weather"><div class="skeleton"></div></div>
        </div>

        <div class="card" id="system-card" hidden>
          <div class="card-head"><h3>Server</h3><span class="muted" id="sys-host"></span></div>
          <div id="system"><div class="skeleton"></div></div>
        </div>

        <div class="card" id="todo-card" hidden>
          <div class="card-head"><h3>Takenlijst</h3><button class="link-btn" id="todo-clear" title="Afgeronde taken verwijderen">Opruimen</button></div>
          <form id="todo-form" class="todo-form">
            <input id="todo-input" type="text" placeholder="Nieuwe taak…" maxlength="500" aria-label="Nieuwe taak">
          </form>
          <ul id="todos" class="todos"></ul>
        </div>

        <div class="card" id="docker-card" hidden>
          <div class="card-head"><h3>Containers</h3><span class="muted" id="docker-count"></span></div>
          <ul id="docker" class="docker"></ul>
        </div>
      </aside>
    </main>
    </div>

    <div id="view-world" hidden>
      <div class="world">
        <div class="globe-wrap card">
          <div id="globe"></div>
          <div class="globe-tools">
            <form id="geo-form" class="geo-search" autocomplete="off">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="geo-input" type="text" placeholder="Zoek een stad of plek…" aria-label="Plek zoeken">
            </form>
            <ul id="geo-results" class="geo-results" hidden></ul>
          </div>
          <div class="globe-btns">
            <button class="icon-btn" id="globe-rotate" title="Automatisch draaien aan/uit" aria-label="Automatisch draaien"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
            <button class="icon-btn" id="globe-arcs" title="Reislijnen vanaf thuis aan/uit" aria-label="Reislijnen"><svg viewBox="0 0 24 24"><path d="M4 18C8 6 16 6 20 18"/><circle cx="4" cy="18" r="1.5"/><circle cx="20" cy="18" r="1.5"/></svg></button>
            <button class="icon-btn" id="globe-home" title="Naar thuis" aria-label="Naar thuis"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg></button>
          </div>
          <div class="globe-hint" id="globe-hint">Klik op de wereldbol om een plek toe te voegen</div>
          <div class="globe-loading" id="globe-loading">Wereldbol laden…</div>
        </div>

        <aside class="world-side">
          <div class="card">
            <div class="world-stats" id="world-stats"></div>
          </div>
          <div class="card places-card">
            <div class="card-head"><h3>Mijn plekken</h3><span class="muted" id="places-count"></span></div>
            <div class="chips" id="place-filter">
              <button data-f="all" class="active">Alles</button>
              <button data-f="visited">Bezocht</button>
              <button data-f="wish">Wil heen</button>
            </div>
            <ul id="places" class="places"></ul>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <dialog id="place-dialog" class="dialog">
    <form method="dialog" id="place-form">
      <h3 id="place-title">Plek toevoegen</h3>
      <div class="muted" id="place-coords"></div>
      <label>Naam<input name="name" required maxlength="120" placeholder="bijv. Barcelona"></label>
      <div class="seg" role="radiogroup" aria-label="Soort">
        <label><input type="radio" name="type" value="visited" checked><span>📍 Bezocht</span></label>
        <label><input type="radio" name="type" value="wish"><span>⭐ Wil heen</span></label>
        <label><input type="radio" name="type" value="home"><span>🏠 Thuis</span></label>
      </div>
      <label><span>Wanneer <span class="muted">(optioneel)</span></span><input name="date" type="month"></label>
      <label><span>Notitie <span class="muted">(optioneel)</span></span><textarea name="note" rows="3" maxlength="1000" placeholder="Herinneringen, tips, met wie…"></textarea></label>
      <div class="dialog-btns">
        <button type="button" class="btn danger" id="place-delete" hidden>Verwijderen</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="place-cancel">Annuleren</button>
        <button type="submit" class="btn primary">Opslaan</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
  <script src="world.js"></script>
</body>
</html>
